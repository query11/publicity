<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Plus 还是 Pro 封面</title>
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/zcool-qingke-huangyou/400.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0d0f13; font-family: 'Noto Sans SC', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; border-radius: 50%; filter: blur(100px); }
  #g1 { left: -260px; top: -300px; width: 1100px; height: 1100px; background: radial-gradient(circle, rgba(255,80,0,.6), rgba(255,80,0,0) 70%); }
  #g2 { left: 1150px; top: 380px; width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(124,58,237,.45), rgba(124,58,237,0) 70%); }
  #grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.4px, transparent 1.4px); background-size: 40px 40px; }
  #tag { position: absolute; left: 110px; top: 110px; padding: 12px 30px; border-radius: 16px; background: #ff5000; font-size: 46px; font-weight: 900; letter-spacing: 2px; }
  #t1 { position: absolute; left: 100px; top: 236px; font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC'; font-size: 158px; line-height: 1.1; letter-spacing: 4px; }
  #t1 .p { color: #5b9bff; } #t1 .q { color: #ffc940; }
  #t2 { position: absolute; left: 106px; top: 470px; font-size: 104px; font-weight: 900; line-height: 1.25; letter-spacing: 2px; }
  #t2 b { color: #ff7a1a; }
  #t3 { position: absolute; left: 110px; top: 800px; display: flex; gap: 18px; }
  #t3 span { padding: 14px 30px; border-radius: 16px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); font-size: 44px; font-weight: 900; }
  #panel { position: absolute; left: 1290px; top: 170px; width: 560px; padding: 44px 44px 30px; border-radius: 34px; background: #fff; color: #14161b; box-shadow: 0 50px 120px rgba(0,0,0,.55); transform: rotate(2deg); }
  .tr { margin-bottom: 30px; }
  .tr .n { display: flex; justify-content: space-between; font-size: 46px; font-weight: 900; }
  .tr .n i { font-style: normal; color: #8a93a3; font-size: 36px; }
  .tr .b { margin-top: 12px; height: 40px; border-radius: 20px; background: #eef1f5; overflow: hidden; }
  .tr .b span { display: block; height: 100%; border-radius: 20px; }
  .ck { border-top: 2px dashed #d6dbe3; padding-top: 22px; }
  .ck div { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 900; padding: 8px 0; }
  .ck div::before { content: '✓'; width: 46px; height: 46px; border-radius: 12px; background: #16b364; color: #fff; display: grid; place-items: center; font-size: 30px; }
</style>
</head>
<body>
  <div class="glow" id="g1"></div><div class="glow" id="g2"></div><div id="grid"></div>
  <div id="tag">开会员前必看</div>
  <div id="t1">开 <span class="p">Plus</span> 还是 <span class="q">Pro</span>？</div>
  <div id="t2"><b>5 种</b>开通方式<br>哪种不踩坑</div>
  <div id="t3"><span>选档位</span><span>选方式</span><span>避坑清单</span></div>
  <div id="panel">
    <div class="tr"><div class="n">Plus<i>日常</i></div><div class="b"><span style="width:7%;background:#3b82f6"></span></div></div>
    <div class="tr"><div class="n">Pro 5x<i>重度</i></div><div class="b"><span style="width:50%;background:#8b5cf6"></span></div></div>
    <div class="tr"><div class="n">Pro 20x<i>高强度</i></div><div class="b"><span style="width:100%;background:linear-gradient(90deg,#e8a300,#ffcf4a)"></span></div></div>
    <div class="ck"><div>充在自己的号上</div><div>有官方账单</div><div>质保写清楚</div></div>
  </div>
<script>
  window.STAGE_READY = (async () => {
    const text = document.body.innerText;
    await Promise.all([700, 900].map(w => document.fonts.load(`${w} 40px "Noto Sans SC"`, text)).concat(document.fonts.load('400 100px "ZCOOL QingKe HuangYou"', text)));
    await document.fonts.ready;
    return true;
  })();
</script>
</body>
</html>
